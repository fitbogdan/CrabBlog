
<div class="pixel-card p-6 my-5">
    <h2 class="font-display text-2xl text-ink [text-shadow:2px_2px_0_rgba(0,0,0,0.35)]"> Add to the conversation </h2>

    <form method="post" action="/post/{{POST_ID}}/reply" class="flex flex-col gap-2 mt-3">
        <textarea name="body" class="font-sans text-sm text-ink bg-bg-deep border-2 border-outline p-2 resize-none overflow-y-auto max-h-64" rows="2" placeholder="Write a reply..." oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,256)+'px'"></textarea>

        <div class="flex justify-between items-center mt-2">
            <p class="font-base text-xs opacity-45 leading-relaxed text-ink"> Be kind, disagree freely </p>

            <button type="submit" class="pixel-btn self-start bg-accent text-bg-deep">post reply</button>
        </div>

    </form>
</div>
