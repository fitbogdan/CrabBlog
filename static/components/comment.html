
<div class="pixel-card relative p-6 my-5">

{{DELETE_COMMENT}}

<div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded flex items-center justify-center font-display text-ink border-2 border-outline" {{AVATAR_COLOR}}> {{FIRST_LETTER}} </div>
    <div class="flex flex-col">
        <p class="font-display text-xl leading-relaxed text-ink"> {{USERNAME}} </p>
        <p class="font-base text-xs opacity-45 leading-relaxed text-ink"> {{DATE_POSTED}} </p>
        <!-- 22 Aug, 19:40 - Here since 2022 -->
    </div>
</div>

<!-- {{USER_CARD}} -->

<p class="font-sans text-base leading-relaxed text-ink whitespace-pre-wrap"> {{COMMENT}} </p>
<details class="mx-3 mt-1 mb-3">
    <summary class="font-display underline text-lg text-ink hover:text-green-400 cursor-pointer list-none [&::-webkit-details-marker]:hidden">
        reply
    </summary>
    <form method="post" action="/post/{{POST_ID}}/reply/{{COMMENT_ID}}" class="flex flex-col gap-2 mt-3 max-w-md">
        <textarea name="body" class="font-sans text-sm text-ink bg-bg-deep border-2 border-outline p-2 resize-none overflow-y-auto max-h-64" rows="2" placeholder="Write a reply..." oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,256)+'px'"></textarea>
        <button type="submit" class="pixel-btn self-start">Post reply</button>
    </form>
</details>


<!-- Subcomments Structure -->
<div class="flex gap-2">
    <div class="w-1 bg-outline"></div>

    <div class="flex flex-col gap-2">
        <!-- Comments Under main Comment -->
        {{SUB_COMMENTS}}
        <!-- Comments Under Main Comment End -->
    </div>
</div>


</div>
