<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeth's Blog</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="font-sans bg-bg text-ink">

    <header class="text-center pt-16 pb-10">
        <h1 class="font-display text-4xl text-accent [text-shadow:3px_3px_0_rgba(0,0,0,0.35)]">Join the Blog, Leave High Dopamine Behind ;) </h1>
        <a href="/login" class="text-muted mt-3">Already have an account? Click here to log in.</a>
    </header>

    <form class="pixel-card flex flex-col gap-3 max-w-md mx-auto p-5 text-center" method="post" action="/register">
        <p class="text-red-700 font-bold">{{ERROR}}</p>
        <input type="text" name="username" class="font-sans text-sm text-ink bg-bg-deep border-2 border-outline p-2 text-left" placeholder="Username">
        <input type="password" name="password" class="font-sans text-sm text-ink bg-bg-deep border-2 border-outline p-2 text-left" placeholder="A strong password so nobody can guess it">
        <input type="password" name="password_again" class="font-sans text-sm text-ink bg-bg-deep border-2 border-outline p-2 text-left" placeholder="Ur password again :)">

        <button type="submit" class="pixel-btn cursor-pointer">Register</button>
    </form>
    <!-- <div class="text-center pt-5">
        <a class="text-sm opacity-40 text-white">We won't share your email.</a>
    </div> -->

</body>
